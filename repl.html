<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>yaw — REPL</title>
<meta name="description" content="Run yaw in the browser. An algebraic quantum programming language.">
<link rel="stylesheet" type="text/css" href="enhanced_tufte.css">
<script src="contents.js"></script><script type="text/javascript" src="sidebar_darkmode.js"></script>
<style>
/* REPL-specific styles, using the same variables and typography as index.html */
.yawmark {
  font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,"DejaVu Sans Mono",monospace;
  font-size:clamp(38px,8vw,64px); font-weight:700; font-style:normal;
  letter-spacing:-.045em; line-height:1.05; margin:2.2rem 0 1.4rem;
  text-align:left; color:var(--text-color,#111);
}
.yawmark-prompt { color:#5B3496; font-weight:400; letter-spacing:-.02em; }
.repl-subtitle { font-style:italic; margin-top:-.6rem; margin-bottom:2rem; font-size:1.4rem; line-height:1.2; color:var(--text-color); }
.repl-status { font-size:1rem; color:var(--text-color); margin:1rem 0 .8rem; font-family:'JetBrains Mono',monospace; }
.repl-status .bar { display:inline-block; width:9rem; height:.42rem; background:var(--border-color); border-radius:2px; vertical-align:middle; margin-left:.5rem; overflow:hidden; }
.repl-status .bar i { display:block; height:100%; width:0; background:#5B3496; transition:width .3s ease; }
#term { width:92%; min-height:18rem; background:var(--code-bg); border:1px solid var(--border-color); border-radius:4px; padding:.9rem 1rem; overflow-y:auto; font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace; font-size:.9rem; line-height:1.65; color:var(--code-text); }
#log { white-space:pre-wrap; word-break:break-word; margin:0; }
#log .in { color:var(--code-text); } #log .in .p { color:#B49BE8; } #log .out { color:var(--code-text); } #log .err { color:#f28a8a; }
#entry { display:flex; align-items:baseline; gap:.5rem; margin-top:.15rem; }
#prompt { color:#B49BE8; font-family:'JetBrains Mono',monospace; font-size:.9rem; flex:0 0 auto; white-space:pre; }
#line { flex:1; border:none; background:transparent; color:var(--code-text); font-family:'JetBrains Mono',monospace; font-size:.9rem; line-height:1.65; padding:0; outline:none; }
#line:disabled { opacity:.4; }
.tools { width:96%; display:flex; flex-wrap:wrap; gap:.45rem; padding:.85rem 0 .3rem; }
.tools button { font-family:inherit; font-size:1rem; background:var(--sidebar-bg); color:var(--text-color); border:1px solid var(--sidebar-border); border-radius:3px; padding:.28rem .7rem; cursor:pointer; }
.tools button:hover:not(:disabled) { border-color:#5B3496; color:#5B3496; }
.tools button:disabled { opacity:.45; cursor:default; } .tools .gap { flex:1; }
.repl-footer { width:55%; padding:.9rem 0 2rem; font-size:1rem; color:var(--text-color); }
.repl-footer kbd { font-family:'JetBrains Mono',monospace; font-size:.78rem; border:1px solid var(--border-color); border-radius:3px; padding:0 .3rem; background:var(--sidebar-bg); }
@media (max-width:1024px) { #term,.tools,.repl-footer { width:90%; } }
@media (max-width:760px) { #term,.tools,.repl-footer { width:100%; }
.yawmark { font-size:clamp(34px,12vw,52px); } }
.yawmark-caret{
  display:inline-block;width:.5em;height:.86em;
  background:#5B3496;vertical-align:-.05em;margin-left:.14em;
  animation:yawmark-blink 1.15s steps(1,end) infinite;
}
@keyframes yawmark-blink{0%,50%{opacity:1}50.01%,100%{opacity:0}}
[data-theme="dark"] .yawmark-prompt,
[data-theme="dark"] .yawmark-caret{color:#B49BE8}
[data-theme="dark"] .yawmark-caret{background:#B49BE8}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .yawmark-prompt{color:#B49BE8}
  :root:not([data-theme="light"]) .yawmark-caret{background:#B49BE8}
}
@media (prefers-reduced-motion:reduce){.yawmark-caret{animation:none;opacity:.45}}
</style>
</head>
<body>
<div id="content">

<h1 class="yawmark"><span class="yawmark-prompt">*&gt;</span>yaw<span class="yawmark-caret"></span></h1>

<div id="status" class="repl-status">Idle. Press Run, or type below, to start the interpreter.</div>

<div id="term"><div id="log"></div>
  <div id="entry">
    <span id="prompt">*&gt;</span>
    <input id="line" type="text" spellcheck="false" autocomplete="off"
           autocapitalize="off" aria-label="yaw input" disabled>
  </div>
</div>

<div class="tools">
  <button id="boot">Run</button>
  <button class="ex" data-ex="bell" disabled>Bell state</button>
  <button class="ex" data-ex="grover" disabled>Grover</button>
  <button class="ex" data-ex="gkp" disabled>GKP</button>
  <button class="ex" data-ex="code" disabled>Five-qubit code</button>
  <span class="gap"></span>
  <button id="clear">Clear</button>
</div>

<p>
  First run downloads the <code>Python</code> interpreter and libraries (about 25&nbsp;MB);
  it is cached afterwards. <kbd>↑</kbd> and <kbd>↓</kbd> walk history,
  <kbd>Enter</kbd> on a blank continuation line ends a block. Type
  <code>help</code> for commands. Use <code>&gt;&gt;</code> and
  <code>&lt;&lt;</code> in place of <code>»</code> and <code>«</code>.
</p>

</div>

<script>
// ---------------------------------------------------------------- config
// Where the yaw sources live, relative to this page.
const YAW_FILES = ['yaw_prototype.py', 'qudit_backend.py', 'yaw_repl.py'];
// Pin a known-good Pyodide; bump when you test a newer one.
const PYODIDE = 'https://cdn.jsdelivr.net/pyodide/v0.27.2/full/';

const EXAMPLES = {
  bell: [
    '$alg = qubit()',
    'CNOT = sum(proj(Z,k) @ X**k for k in range(2))',
    'EPR = CNOT << (char(X, 0) @ char(Z, 0))',
    '[op | EPR for op in [X @ X, Z @ Z]]',
    '[op | EPR for op in [X @ I, Z @ I]]'
  ],
  grover: [
    'def grover(d, marked):',
    '    $alg = qudit(d)',
    '    def reflect(P): return I - 2*P',
    '    G = reflect(proj(Z, marked)) * (-reflect(proj(X, 0)))',
    '    r = int((pi/4)*sqrt(d)) + 1',
    '    return measure(Z, (G**r) << char(X, 0))()[1]',
    '',
    'd, marked, trials = 5, 3, 100',
    'sum(grover(d, marked) == marked for _ in range(trials))/trials'
  ],
  gkp: [
    '$alg = <X, Z | unit, braid(-1)>',
    'gkp = weylState(lambda a, b: 1 if a % 2 == 0 else 0)',
    'gkp | X**2, gkp | Z**2',
    'gkp | X, gkp | Z',
    '(X*Z + Z*X).normalize()'
  ],
  code: [
    '$alg = qubit()',
    'code = five_qubit_code()',
    'len(code.stabilizers)',
    'code.stabilizers[0]'
  ]
};

// ---------------------------------------------------------------- worker
const workerSource = `
let pyodide = null;

function post(type, payload) { self.postMessage(Object.assign({type}, payload)); }

async function boot(cfg) {
  post('status', {text: 'Fetching the Python interpreter…', pct: 5});
  importScripts(cfg.pyodide + 'pyodide.js');
  pyodide = await loadPyodide({indexURL: cfg.pyodide});

  post('status', {text: 'Loading numpy and sympy…', pct: 30});
  await pyodide.loadPackage(['numpy', 'sympy', 'micropip']);

  post('status', {text: 'Loading networkx…', pct: 60});
  // networkx is used in exactly two lines (stabiliser clique finding). If the
  // wheel is unavailable, stub it so the import still succeeds.
  try {
    const micropip = pyodide.pyimport('micropip');
    await micropip.install('networkx');
  } catch (e) {
    pyodide.FS.writeFile('/home/pyodide/networkx.py',
      'def Graph(*a, **k):\\n    raise NotImplementedError("networkx unavailable in this build")\\n' +
      'def find_cliques(*a, **k):\\n    raise NotImplementedError("networkx unavailable in this build")\\n');
  }

  post('status', {text: 'Loading yaw…', pct: 80});
  for (const name of cfg.files) {
    const res = await fetch(cfg.base + name);
    if (!res.ok) throw new Error('could not fetch ' + name + ' (' + res.status + ')');
    pyodide.FS.writeFile('/home/pyodide/' + name, await res.text());
  }

  await pyodide.runPythonAsync(\`
import sys, io, json, contextlib, traceback
sys.path.insert(0, '/home/pyodide')
from yaw_repl import YawREPL

_repl = YawREPL()

def yaw_reset():
    global _repl
    _repl = YawREPL()

def yaw_eval(line):
    out = io.StringIO()
    err = False
    try:
        with contextlib.redirect_stdout(out), contextlib.redirect_stderr(out):
            result = _repl.eval_line(line)
            if result is not None:
                _repl._display(result)
    except Exception as e:
        out.write('Error: %s' % e)
        err = True
    return json.dumps({
        'out': out.getvalue(),
        'cont': bool(getattr(_repl, 'in_statement', False)),
        'err': err,
    })
\`);

  post('status', {text: 'Ready.', pct: 100});
  post('ready', {});
}

self.onmessage = async (e) => {
  const msg = e.data;
  try {
    if (msg.type === 'boot')  { await boot(msg.cfg); }
    else if (msg.type === 'eval') {
      const raw = pyodide.globals.get('yaw_eval')(msg.line);
      post('result', Object.assign({id: msg.id}, JSON.parse(raw)));
    }
    else if (msg.type === 'reset') {
      pyodide.globals.get('yaw_reset')();
      post('reset-done', {});
    }
  } catch (err) {
    post('fatal', {text: String(err && err.message || err)});
  }
};
`;

// ---------------------------------------------------------------- ui
const logEl    = document.getElementById('log');
const termEl   = document.getElementById('term');
const lineEl   = document.getElementById('line');
const promptEl = document.getElementById('prompt');
const statusEl = document.getElementById('status');
const bootBtn  = document.getElementById('boot');
const clearBtn = document.getElementById('clear');
const exBtns   = Array.from(document.querySelectorAll('.ex'));

let worker = null, ready = false, busy = false, cont = false;
let history = [], hIndex = 0, queue = [];

function scroll() { termEl.scrollTop = termEl.scrollHeight; }

function write(text, cls) {
  if (!text) return;
  const span = document.createElement('span');
  span.className = cls || 'out';
  span.textContent = text.replace(/\n+$/, '') + '\n';
  logEl.appendChild(span);
  scroll();
}

function echo(line) {
  const span = document.createElement('span');
  span.className = 'in';
  const p = document.createElement('span');
  p.className = 'p';
  p.textContent = (cont ? '... ' : '*> ');
  span.appendChild(p);
  span.appendChild(document.createTextNode(line + '\n'));
  logEl.appendChild(span);
  scroll();
}

function setStatus(text, pct) {
  statusEl.innerHTML = '';
  statusEl.appendChild(document.createTextNode(text));
  if (typeof pct === 'number') {
    const bar = document.createElement('span');
    bar.className = 'bar';
    const fill = document.createElement('i');
    fill.style.width = pct + '%';
    bar.appendChild(fill);
    statusEl.appendChild(bar);
  }
}

function setPrompt() { promptEl.textContent = cont ? '...' : '*>'; }

function startWorker() {
  if (worker) return;
  bootBtn.disabled = true;
  const blob = new Blob([workerSource], {type: 'application/javascript'});
  worker = new Worker(URL.createObjectURL(blob));

  worker.onmessage = (e) => {
    const m = e.data;
    if (m.type === 'status') setStatus(m.text, m.pct);
    else if (m.type === 'ready') {
      ready = true;
      setStatus('Ready. yaw 0.1.1 — type help for commands.');
      lineEl.disabled = false;
      exBtns.forEach(b => b.disabled = false);
      lineEl.focus();
      drain();
    }
    else if (m.type === 'result') {
      busy = false;
      cont = m.cont;
      setPrompt();
      write(m.out, m.err ? 'err' : 'out');
      drain();
    }
    else if (m.type === 'reset-done') {
      busy = false; cont = false; setPrompt();
      write('— session reset —');
      drain();
    }
    else if (m.type === 'fatal') {
      busy = false;
      setStatus('Failed to start.');
      write(m.text, 'err');
      bootBtn.disabled = false;
    }
  };

  worker.postMessage({
    type: 'boot',
    cfg: {
      pyodide: PYODIDE,
      base: new URL('.', location.href).href,
      files: YAW_FILES
    }
  });
}

function send(line) {
  queue.push(line);
  if (!ready) startWorker();
  drain();
}

function drain() {
  if (!ready || busy || !queue.length) return;
  const line = queue.shift();
  echo(line);
  busy = true;
  worker.postMessage({type: 'eval', line, id: Date.now()});
}

lineEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    const value = lineEl.value;
    lineEl.value = '';
    if (value.trim()) { history.push(value); }
    hIndex = history.length;
    send(value);
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (hIndex > 0) { hIndex--; lineEl.value = history[hIndex]; }
  } else if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (hIndex < history.length - 1) { hIndex++; lineEl.value = history[hIndex]; }
    else { hIndex = history.length; lineEl.value = ''; }
  }
});

// paste of several lines: feed them one at a time
lineEl.addEventListener('paste', (e) => {
  const text = (e.clipboardData || window.clipboardData).getData('text');
  if (!text.includes('\n')) return;
  e.preventDefault();
  text.split('\n').forEach(l => {
    const clean = l.replace(/^\s*(\*>|\.\.\.)\s?/, '');
    history.push(clean);
    send(clean);
  });
  hIndex = history.length;
});

bootBtn.addEventListener('click', () => { startWorker(); lineEl.focus(); });

clearBtn.addEventListener('click', () => {
  logEl.innerHTML = '';
  if (ready) { busy = true; worker.postMessage({type: 'reset'}); }
});

exBtns.forEach(btn => btn.addEventListener('click', () => {
  EXAMPLES[btn.dataset.ex].forEach(l => { history.push(l); send(l); });
  hIndex = history.length;
  lineEl.focus();
}));

termEl.addEventListener('click', () => { if (!lineEl.disabled) lineEl.focus(); });
</script>
</body>
</html>
